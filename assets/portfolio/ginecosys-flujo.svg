<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
  <title id="title">GinecoSys Web — flujo ilustrativo</title>
  <desc id="desc">Esquema conceptual con tres etapas: agenda, consulta y expediente clínico. No es una captura de la aplicación.</desc>
  <rect width="720" height="405" fill="#000"/>
  <rect x="1" y="1" width="718" height="403" rx="16" fill="none" stroke="#343434" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <path d="M40 40h32" stroke="#42b88a" stroke-width="3"/>
    <text x="85" y="47" font-size="20" font-weight="600" fill="#c2c2c2">FLUJO ILUSTRATIVO / ILLUSTRATIVE WORKFLOW</text>
    <text x="40" y="115" font-size="52" font-weight="650" fill="#f2f2f0">GinecoSys Web</text>
    <path d="M79 203h560" fill="none" stroke="#4a4a4a" stroke-width="2"/>
    <g fill="#0c0c0c" stroke="#42b88a" stroke-width="2"><circle cx="120" cy="203" r="22"/><circle cx="360" cy="203" r="22"/><circle cx="600" cy="203" r="22"/></g>
    <g text-anchor="middle" font-size="22" font-weight="650" fill="#65cfa8"><text x="120" y="211">1</text><text x="360" y="211">2</text><text x="600" y="211">3</text></g>
    <g text-anchor="middle" font-size="30" font-weight="600" fill="#f2f2f0"><text x="120" y="279">Agenda</text><text x="360" y="279">Consulta</text><text x="600" y="279">Expediente</text></g>
    <g text-anchor="middle" font-size="23" fill="#bcbcbc"><text x="120" y="315">Scheduling</text><text x="360" y="315">Visit</text><text x="600" y="315">Records</text></g>
    <path d="M40 356h640" stroke="#343434"/>
